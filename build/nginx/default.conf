server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Treat local/proxy traffic as trusted so nginx resolves the real client IP
    # from X-Forwarded-For and passes it to PHP-FPM as REMOTE_ADDR.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Redirect /index.php/... to clean canonical paths (301).
    # The ^~ prefix wins over the regex PHP location and only matches real
    # /index.php/... requests; the try_files fallback to /index.php below is
    # not affected, so this cannot create a redirect loop.
    location ^~ /index.php/ {
        rewrite ^/index\.php/(.*)$ /$1 permanent;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;

        # Pass the real client IP through to PHP-FPM when an upstream proxy
        # (Cloudflare, host Nginx, Traefik, etc.) sends X-Forwarded-For.
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_REAL_IP $http_x_real_ip;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
