log_format realip '$remote_addr - $realip_remote_addr - [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" xff="$http_x_forwarded_for" '
                'cf="$http_cf_connecting_ip" xri="$http_x_real_ip"';

map $http_cf_connecting_ip $realip_remote_addr {
    default $http_cf_connecting_ip;
    '' $remote_addr;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 32m;

    access_log /dev/stdout realip;
    error_log /dev/stderr warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Treat local/proxy traffic as trusted so nginx resolves the real client IP
    # from X-Forwarded-For and passes it to PHP-FPM as REMOTE_ADDR.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    # Cloudflare edge ranges (https://www.cloudflare.com/ips/)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Redirect /index.php/... to clean canonical paths (301).
    # The ^~ prefix wins over the regex PHP location and only matches real
    # /index.php/... requests; the try_files fallback to /index.php below is
    # not affected, so this cannot create a redirect loop.
    location ^~ /index.php/ {
        rewrite ^/index\.php/(.*)$ /$1 permanent;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;

        # Pass the real client IP through to PHP-FPM when an upstream proxy
        # (Cloudflare, host Nginx, Traefik, etc.) sends X-Forwarded-For.
        fastcgi_param REMOTE_ADDR $realip_remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_REAL_IP $http_x_real_ip;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
